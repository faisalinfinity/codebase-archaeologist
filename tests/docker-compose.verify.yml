services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: archaeologist
      POSTGRES_PASSWORD: verification-only
      POSTGRES_DB: archaeologist_verify
    ports: ['127.0.0.1:55432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U archaeologist -d archaeologist_verify']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:56379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
